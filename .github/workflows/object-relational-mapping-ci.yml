name: Python Object-relational mapping tests

on:
  push:
    paths:
      - 'python-object_relational_mapping/**'
      - '.github/workflows/object-relational-mapping-ci.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: hbtn_0e_0_usa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Python and MySQL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install mysqlclient==2.0.3 SQLAlchemy==1.4.46 pycodestyle==2.10.0

      - name: Check Python syntax, style, and executable flags
        working-directory: python-object_relational_mapping
        run: |
          python -m compileall -q .
          pycodestyle --max-line-length=79 *.py
          python - <<'PY'
          import os
          from pathlib import Path
          for path in Path('.').glob('*.py'):
              data = path.read_bytes()
              assert data.startswith(b'#!/usr/bin/python3\n'), path
              assert data.endswith(b'\n'), path
              assert os.access(str(path), os.X_OK), path
          print('PASS syntax/style/executable checks')
          PY

      - name: Integration tests for all 15 tasks against MySQL 8
        working-directory: python-object_relational_mapping
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import MySQLdb

          DB = 'hbtn_0e_0_usa'
          ARGS = ('root', 'testpass', DB)
          STATES = [(1, 'California'), (2, 'Arizona'),
                    (3, 'Texas'), (4, 'New York'),
                    (5, 'New Mexico'), (6, 'Alabama')]
          CITIES = [(1, 'San Francisco', 1),
                    (2, 'Los Angeles', 1),
                    (3, 'Phoenix', 2),
                    (4, 'Dallas', 3),
                    (5, 'Buffalo', 4)]
          total = 0

          def connection():
              return MySQLdb.connect(host='127.0.0.1', port=3306,
                                     user='root', passwd='testpass', db=DB)

          def reset(cities=False):
              con = connection()
              cur = con.cursor()
              cur.execute('DROP TABLE IF EXISTS cities')
              cur.execute('DROP TABLE IF EXISTS states')
              cur.execute('CREATE TABLE states (id INT PRIMARY KEY '
                          'AUTO_INCREMENT, name VARCHAR(128) NOT NULL)')
              cur.executemany(
                  'INSERT INTO states (id, name) VALUES (%s, %s)', STATES)
              if cities:
                  cur.execute('CREATE TABLE cities ('
                              'id INT PRIMARY KEY AUTO_INCREMENT, '
                              'name VARCHAR(128) NOT NULL, '
                              'state_id INT NOT NULL, '
                              'FOREIGN KEY (state_id) REFERENCES states(id))')
                  cur.executemany(
                      'INSERT INTO cities (id, name, state_id) '
                      'VALUES (%s, %s, %s)', CITIES)
              con.commit()
              cur.close()
              con.close()

          def run(path, *extra):
              result = subprocess.run(
                  [sys.executable, path, *ARGS, *extra],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=25)
              assert result.returncode == 0, (
                  path + ' failed: ' + result.stderr)
              return result.stdout.strip()

          def verify(label, actual, expected):
              global total
              assert actual == expected, (
                  label + ': expected ' + repr(expected) +
                  ', got ' + repr(actual))
              total += 1
              print('PASS', label)

          reset()
          verify('Task 0: select states',
                 run('0-select_states.py'),
                 '\n'.join(map(str, STATES)))
          verify('Task 1: uppercase N only',
                 run('1-filter_states.py'),
                 '\n'.join(map(str, STATES[3:5])))
          verify('Task 2: filter by supplied name',
                 run('2-my_filter_states.py', 'Arizona'),
                 str(STATES[1]))
          verify('Task 3: safe filter',
                 run('3-my_safe_filter_states.py', 'Arizona'),
                 str(STATES[1]))
          verify('Task 3: injection does not match',
                 run('3-my_safe_filter_states.py',
                     "Arizona' OR '1'='1"), '')

          reset(cities=True)
          verify('Task 4: joined cities',
                 run('4-cities_by_state.py'),
                 '\n'.join(str((city_id, city_name,
                                STATES[state_id - 1][1]))
                           for city_id, city_name, state_id in CITIES))
          verify('Task 5: cities by state',
                 run('5-filter_cities.py', 'California'),
                 'San Francisco, Los Angeles')
          verify('Task 5: no matching cities',
                 run('5-filter_cities.py', 'Atlantis'), '')

          from model_state import Base, State
          from model_city import City
          verify('Task 6: State mapping',
                 (State.__tablename__, tuple(Base.metadata.tables)),
                 ('states', ('states', 'cities')))
          verify('Task 14 model: City mapping',
                 (City.__tablename__, len(City.__table__.columns)),
                 ('cities', 3))

          reset()
          verify('Task 7: SQLAlchemy fetch all',
                 run('7-model_state_fetch_all.py'),
                 '\n'.join('{}: {}'.format(*s) for s in STATES))
          verify('Task 8: SQLAlchemy first state',
                 run('8-model_state_fetch_first.py'), '1: California')
          verify('Task 9: filter states containing a',
                 run('9-model_state_filter_a.py'),
                 '\n'.join('{}: {}'.format(*s)
                           for s in STATES if s[0] in (1, 2, 3, 6)))
          verify('Task 10: state name lookup',
                 run('10-model_state_my_get.py', 'Arizona'), '2')
          verify('Task 10: missing state',
                 run('10-model_state_my_get.py', 'Atlantis'), 'Not found')

          reset()
          verify('Task 11: insert Louisiana',
                 run('11-model_state_insert.py'), '7')
          con = connection()
          cur = con.cursor()
          cur.execute('SELECT name FROM states WHERE id = 7')
          verify('Task 11: persistent insert',
                 cur.fetchone()[0], 'Louisiana')
          con.close()

          reset()
          verify('Task 12: update id 2 returns no output',
                 run('12-model_state_update_id_2.py'), '')
          con = connection()
          cur = con.cursor()
          cur.execute('SELECT name FROM states WHERE id = 2')
          verify('Task 12: name updated', cur.fetchone()[0], 'New Mexico')
          con.close()

          reset()
          verify('Task 13: delete matching states',
                 run('13-model_state_delete_a.py'), '')
          con = connection()
          cur = con.cursor()
          cur.execute('SELECT id, name FROM states ORDER BY id')
          verify('Task 13: remaining states',
                 cur.fetchall(), tuple(STATES[3:5]))
          con.close()

          reset(cities=True)
          verify('Task 14: fetch cities by state',
                 run('14-model_city_fetch_by_state.py'),
                 '\n'.join('{}: ({}) {}'.format(
                     STATES[state_id - 1][1], city_id, city_name)
                     for city_id, city_name, state_id in CITIES))

          reset()
          con = connection()
          con.cursor().execute('DELETE FROM states')
          con.commit()
          con.close()
          verify('Task 8: empty table',
                 run('8-model_state_fetch_first.py'), 'Nothing')
          print('ALL {} integration checks passed'.format(total))
          PY
